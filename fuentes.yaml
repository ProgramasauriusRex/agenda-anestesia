# ============================================================================
#  FUENTES A RASTREAR
#  Agenda de Anestesiología, Cuidados Críticos y Terapia del Dolor (España)
# ============================================================================
#
#  ESTE ES EL ÚNICO FICHERO QUE NECESITAS TOCAR.
#  Para añadir una web nueva, copia un bloque de cuatro líneas y cambia los datos.
#
#  nivel   1 = se revisa cada semana
#          2 = se revisa una vez al mes
#          3 = se revisa cada tres meses
#  ambito  anestesia | criticos | dolor | mixto
#  filtro  evento    -> basta con que el texto diga "curso", "congreso"...
#          estricto  -> además tiene que mencionar la especialidad
#                       (úsalo en webs generalistas: universidades, hospitales,
#                        agregadores; si no, se llena de ruido)
#  estado  pendiente -> aún no comprobada
#          ok        -> comprobada y funcionando
#          roto      -> no responde; el programa la salta
#          El programa "verificar.py" pone este campo al día solo.
#
#  Total de fuentes en este fichero: 211
# ============================================================================

