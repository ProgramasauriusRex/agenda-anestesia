name: Diagnóstico

# Solo a mano: este no hace falta que corra solo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python diagnostico.py

      - name: Guardar el informe
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add salida
          git diff --staged --quiet || git commit -m "Diagnóstico $(date +%Y-%m-%d)"
          git push
