name: Agenda semanal

# Cuándo se ejecuta solo:
on:
  schedule:
    - cron: "0 6 * * 1"     # todos los lunes (06:00 UTC = 08:00 en España)
  workflow_dispatch:         # y siempre que le des al botón "Run workflow"

permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Todas las fuentes, todas las semanas. Los cursos que se muestran son
      # los del próximo mes; el resto se guarda en memoria para cuando toque.
      - name: Rastrear
        run: python agenda.py --nivel 1 2 3 --meses 1 --diagnostico

      - name: Guardar la agenda en el repositorio
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add salida estado.json fuentes.yaml
          git diff --staged --quiet || git commit -m "Agenda $(date +%Y-%m-%d)"
          git push

      - name: Dejarla también como fichero descargable
        uses: actions/upload-artifact@v4
        with:
          name: agenda-${{ github.run_number }}
          path: salida/
