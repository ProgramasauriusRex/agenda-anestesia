name: Verificar fuentes

on:
  schedule:
    - cron: "0 5 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python verificar.py

      - name: Guardar el informe
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add salida fuentes.yaml
          git diff --staged --quiet || git commit -m "Verificación de fuentes $(date +%Y-%m-%d)"
          git push
